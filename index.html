<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F10">
<title>挪车码</title>
<style>
html,body{margin:0;height:100%;background:#0B0F10;color:#F1F3EF}
#boot{display:grid;place-items:center;height:100%;font:500 14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;color:#8C9491}
#boot span{opacity:.9}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
#boot span{animation:breathe 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="boot"><span>正在载入</span></div>
<script>
(function () {
  function b64ToText(b64) {
    var raw = atob(b64.replace(/\s+/g, ''));
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('no-decompression');
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function grab(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error('fetch-fail:' + url + ':' + r.status);
      return r.text();
    }).then(b64ToText);
  }
  boot: {
    try {
      grab('./data/lib.b64').then(function (code) {
        (0, eval)(code);
        return grab('./data/page.b64');
      }).then(function (html) {
        document.open();
        document.write(html);
        document.close();
      }).catch(function (e) {
        var b = document.getElementById('boot');
        if (b) b.innerHTML = '<span style="animation:none">页面载入失败，请刷新重试</span>';
      });
    } catch (e) {
      var b2 = document.getElementById('boot');
      if (b2) b2.innerHTML = '<span style="animation:none">当前浏览器不支持，请换用新版浏览器</span>';
    }
  }
})();
</script>
</body>
</html>
